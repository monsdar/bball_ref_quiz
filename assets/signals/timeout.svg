<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background -->
  <rect width="200" height="200" rx="20" fill="#f8fafc" />
  <circle cx="100" cy="100" r="85" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Referee Torso -->
  <path d="M 60 190 L 60 150 C 60 135 80 125 100 125 C 120 125 140 135 140 150 L 140 190 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
  <!-- Stripes -->
  <path d="M 75 130 L 75 190" stroke="#0f172a" stroke-width="6"/>
  <path d="M 100 125 L 100 190" stroke="#0f172a" stroke-width="6"/>
  <path d="M 125 130 L 125 190" stroke="#0f172a" stroke-width="6"/>

  <!-- Head -->
  <circle cx="100" cy="95" r="20" fill="#fed7aa" stroke="#0f172a" stroke-width="3"/>
  <path d="M 80 90 C 82 78 91 75 100 75 C 109 75 118 78 120 90 Z" fill="#334155"/>

  <!-- Arms forming 'T' for Timeout -->
  <!-- Left arm holding open flat hand horizontally over head -->
  <path d="M 65 145 Q 60 100 90 70" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <!-- Flat horizontal hand forming top bar of T -->
  <rect x="75" y="62" width="50" height="10" rx="4" fill="#fed7aa" stroke="#0f172a" stroke-width="2"/>

  <!-- Right arm vertical pointing index finger to middle of palm -->
  <path d="M 135 145 Q 125 110 100 85" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <!-- Vertical index finger touching palm -->
  <line x1="100" y1="72" x2="100" y2="92" stroke="#fed7aa" stroke-width="6" stroke-linecap="round"/>

  <!-- Label badge -->
  <rect x="35" y="15" width="130" height="26" rx="13" fill="#ea580c"/>
  <text x="100" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">FIBA Signal: Auszeit</text>
</svg>
