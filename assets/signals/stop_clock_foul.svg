<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background -->
  <rect width="200" height="200" rx="20" fill="#f8fafc" />
  <circle cx="100" cy="100" r="85" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Referee Torso -->
  <path d="M 60 190 L 60 155 C 60 140 80 130 100 130 C 120 130 140 140 140 155 L 140 190 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
  <!-- Stripes -->
  <path d="M 75 135 L 75 190" stroke="#0f172a" stroke-width="6"/>
  <path d="M 100 130 L 100 190" stroke="#0f172a" stroke-width="6"/>
  <path d="M 125 135 L 125 190" stroke="#0f172a" stroke-width="6"/>

  <!-- Head -->
  <circle cx="95" cy="105" r="20" fill="#fed7aa" stroke="#0f172a" stroke-width="3"/>
  <path d="M 75 100 C 77 88 86 85 95 85 C 105 85 113 88 115 100 Z" fill="#334155"/>

  <!-- Right Arm Raised Straight Up with Clenched Fist (Stop Clock for Foul) -->
  <path d="M 130 145 L 130 65" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
  <!-- Sleeve cuff -->
  <rect x="123" y="65" width="14" height="6" rx="2" fill="#0f172a"/>
  <!-- Forearm skin & Clenched Fist -->
  <path d="M 130 65 L 130 48" stroke="#fed7aa" stroke-width="8" stroke-linecap="round"/>
  <circle cx="130" cy="45" r="9" fill="#fed7aa" stroke="#0f172a" stroke-width="3"/>

  <!-- Left arm down / pointing towards offending player / table -->
  <path d="M 70 145 Q 60 160 50 165" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>

  <!-- Impact / Attention burst around fist -->
  <line x1="130" y1="28" x2="130" y2="22" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
  <line x1="145" y1="36" x2="151" y2="32" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
  <line x1="115" y1="36" x2="109" y2="32" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>

  <!-- Label badge -->
  <rect x="25" y="15" width="150" height="26" rx="13" fill="#ea580c"/>
  <text x="100" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">FIBA Signal: Uhr stoppen (Foul)</text>
</svg>
