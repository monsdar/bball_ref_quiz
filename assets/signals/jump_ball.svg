<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background subtle badge -->
  <rect width="200" height="200" rx="20" fill="#f8fafc" />
  <circle cx="100" cy="100" r="85" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Referee Torso / Striped Shirt -->
  <path d="M 60 190 L 60 145 C 60 130 80 120 100 120 C 120 120 140 130 140 145 L 140 190 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
  <!-- Stripes -->
  <path d="M 75 125 L 75 190" stroke="#0f172a" stroke-width="6"/>
  <path d="M 100 120 L 100 190" stroke="#0f172a" stroke-width="6"/>
  <path d="M 125 125 L 125 190" stroke="#0f172a" stroke-width="6"/>
  
  <!-- Whistle Lanyard & Whistle -->
  <path d="M 90 120 L 98 135 L 100 140 L 102 135 L 110 120" fill="none" stroke="#f97316" stroke-width="2"/>
  <circle cx="100" cy="142" r="4" fill="#f97316"/>

  <!-- Head -->
  <circle cx="100" cy="85" r="20" fill="#fed7aa" stroke="#0f172a" stroke-width="3"/>
  <path d="M 80 80 C 82 66 90 64 100 64 C 110 64 118 66 120 80 Z" fill="#334155"/>

  <!-- Signal: Jump Ball / Held Ball (Both thumbs pointed up) -->
  <!-- Left arm -->
  <path d="M 68 140 Q 65 110 80 98" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <!-- Left fist with thumb up -->
  <circle cx="78" cy="98" r="8" fill="#fed7aa" stroke="#0f172a" stroke-width="3"/>
  <rect x="74" y="82" width="6" height="15" rx="3" fill="#fed7aa" stroke="#0f172a" stroke-width="2"/>

  <!-- Right arm -->
  <path d="M 132 140 Q 135 110 120 98" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <!-- Right fist with thumb up -->
  <circle cx="122" cy="98" r="8" fill="#fed7aa" stroke="#0f172a" stroke-width="3"/>
  <rect x="120" y="82" width="6" height="15" rx="3" fill="#fed7aa" stroke="#0f172a" stroke-width="2"/>

  <!-- Upward motion indicator arrows -->
  <path d="M 77 76 L 77 66" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
  <polygon points="73,68 77,60 81,68" fill="#ea580c"/>
  
  <path d="M 123 76 L 123 66" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
  <polygon points="119,68 123,60 127,68" fill="#ea580c"/>

  <!-- Label badge -->
  <rect x="25" y="15" width="150" height="26" rx="13" fill="#ea580c"/>
  <text x="100" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">FIBA Signal: Sprungball</text>
</svg>
