<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background subtle badge -->
  <rect width="200" height="200" rx="20" fill="#f8fafc" />
  <circle cx="100" cy="100" r="85" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Referee Torso / Striped Shirt -->
  <path d="M 60 190 L 60 145 C 60 130 80 120 100 120 C 120 120 140 130 140 145 L 140 190 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
  <!-- Stripes -->
  <path d="M 75 125 L 75 190" stroke="#0f172a" stroke-width="6"/>
  <path d="M 100 120 L 100 190" stroke="#0f172a" stroke-width="6"/>
  <path d="M 125 125 L 125 190" stroke="#0f172a" stroke-width="6"/>
  
  <!-- Whistle Lanyard & Whistle -->
  <path d="M 90 120 L 98 135 L 100 140 L 102 135 L 110 120" fill="none" stroke="#f97316" stroke-width="2"/>
  <circle cx="100" cy="142" r="4" fill="#f97316"/>

  <!-- Head -->
  <circle cx="100" cy="90" r="22" fill="#fed7aa" stroke="#0f172a" stroke-width="3"/>
  <path d="M 78 85 C 80 70 90 68 100 68 C 110 68 120 70 122 85 Z" fill="#334155"/>

  <!-- Rotating Fists (Travelling Sign) -->
  <!-- Left arm & fist -->
  <path d="M 70 135 Q 60 115 80 105" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="85" cy="102" r="10" fill="#fed7aa" stroke="#0f172a" stroke-width="3"/>
  
  <!-- Right arm & fist -->
  <path d="M 130 135 Q 140 115 120 115" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="115" cy="115" r="10" fill="#fed7aa" stroke="#0f172a" stroke-width="3"/>

  <!-- Circular Motion Rotation Arrows -->
  <path d="M 75 90 A 28 28 0 0 1 125 90" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="4,3"/>
  <polygon points="127,85 133,93 124,95" fill="#ea580c"/>
  <path d="M 125 128 A 28 28 0 0 1 75 128" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="4,3"/>
  <polygon points="73,133 67,125 76,123" fill="#ea580c"/>

  <!-- Label badge -->
  <rect x="35" y="15" width="130" height="26" rx="13" fill="#ea580c"/>
  <text x="100" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">FIBA Signal: Schrittfehler</text>
</svg>
