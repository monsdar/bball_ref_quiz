<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background subtle badge -->
  <rect width="200" height="200" rx="20" fill="#f8fafc" />
  <circle cx="100" cy="100" r="85" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Referee Torso / Striped Shirt -->
  <path d="M 60 190 L 60 145 C 60 130 80 120 100 120 C 120 120 140 130 140 145 L 140 190 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
  <!-- Stripes -->
  <path d="M 75 125 L 75 190" stroke="#0f172a" stroke-width="6"/>
  <path d="M 100 120 L 100 190" stroke="#0f172a" stroke-width="6"/>
  <path d="M 125 125 L 125 190" stroke="#0f172a" stroke-width="6"/>
  
  <!-- Whistle Lanyard & Whistle -->
  <path d="M 90 120 L 98 135 L 100 140 L 102 135 L 110 120" fill="none" stroke="#f97316" stroke-width="2"/>
  <circle cx="100" cy="142" r="4" fill="#f97316"/>

  <!-- Head -->
  <circle cx="100" cy="85" r="20" fill="#fed7aa" stroke="#0f172a" stroke-width="3"/>
  <path d="M 80 80 C 82 66 90 64 100 64 C 110 64 118 66 120 80 Z" fill="#334155"/>

  <!-- Signal: Charging / Offensive Foul (Clenched fist striking open palm) -->
  <!-- Left arm holding open palm -->
  <path d="M 65 140 Q 60 115 88 115" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <!-- Open palm -->
  <rect x="85" y="105" width="10" height="20" rx="4" fill="#fed7aa" stroke="#0f172a" stroke-width="3" transform="rotate(-15 90 115)"/>
  
  <!-- Right arm with clenched fist punching into open palm -->
  <path d="M 135 140 Q 140 115 110 115" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <!-- Clenched fist striking palm -->
  <circle cx="108" cy="115" r="9" fill="#fed7aa" stroke="#0f172a" stroke-width="3"/>

  <!-- Impact action lines -->
  <path d="M 96 102 L 94 94" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
  <path d="M 103 100 L 105 92" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
  <path d="M 98 128 L 97 134" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>

  <!-- Label badge -->
  <rect x="30" y="15" width="140" height="26" rx="13" fill="#ea580c"/>
  <text x="100" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">FIBA Signal: Stürmerfoul</text>
</svg>
