<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background subtle badge -->
  <rect width="200" height="200" rx="20" fill="#f8fafc" />
  <circle cx="100" cy="100" r="85" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Referee Torso / Striped Shirt -->
  <path d="M 60 190 L 60 145 C 60 130 80 120 100 120 C 120 120 140 130 140 145 L 140 190 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
  <!-- Stripes -->
  <path d="M 75 125 L 75 190" stroke="#0f172a" stroke-width="6"/>
  <path d="M 100 120 L 100 190" stroke="#0f172a" stroke-width="6"/>
  <path d="M 125 125 L 125 190" stroke="#0f172a" stroke-width="6"/>
  
  <!-- Whistle Lanyard & Whistle -->
  <path d="M 90 120 L 98 135 L 100 140 L 102 135 L 110 120" fill="none" stroke="#f97316" stroke-width="2"/>
  <circle cx="100" cy="142" r="4" fill="#f97316"/>

  <!-- Head -->
  <circle cx="100" cy="85" r="20" fill="#fed7aa" stroke="#0f172a" stroke-width="3"/>
  <path d="M 80 80 C 82 66 90 64 100 64 C 110 64 118 66 120 80 Z" fill="#334155"/>

  <!-- Signal: Illegal Dribble / Double Dribble (Patting motion with both hands) -->
  <!-- Left arm forward, hand down -->
  <path d="M 68 140 Q 60 115 80 108" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <!-- Left hand horizontal, palm down -->
  <rect x="74" y="104" width="22" height="8" rx="4" fill="#fed7aa" stroke="#0f172a" stroke-width="2"/>

  <!-- Right arm forward, hand down slightly lower -->
  <path d="M 132 140 Q 140 120 118 122" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <!-- Right hand horizontal, palm down -->
  <rect x="108" y="118" width="22" height="8" rx="4" fill="#fed7aa" stroke="#0f172a" stroke-width="2"/>

  <!-- Alternating patting arrows -->
  <!-- Left hand motion arrow (moving up) -->
  <path d="M 85 96 L 85 86" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="81,89 85,82 89,89" fill="#ea580c"/>

  <!-- Right hand motion arrow (moving down) -->
  <path d="M 119 132 L 119 142" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="115,139 119,146 123,139" fill="#ea580c"/>

  <!-- Label badge -->
  <rect x="25" y="15" width="150" height="26" rx="13" fill="#ea580c"/>
  <text x="100" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">FIBA Signal: Doppeldribbel</text>
</svg>
