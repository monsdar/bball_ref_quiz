<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background subtle badge -->
  <rect width="200" height="200" rx="20" fill="#f8fafc" />
  <circle cx="100" cy="100" r="85" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Referee Torso / Striped Shirt -->
  <path d="M 60 190 L 60 150 C 60 135 80 128 100 128 C 120 128 140 135 140 150 L 140 190 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
  <!-- Stripes -->
  <path d="M 75 132 L 75 190" stroke="#0f172a" stroke-width="6"/>
  <path d="M 100 128 L 100 190" stroke="#0f172a" stroke-width="6"/>
  <path d="M 125 132 L 125 190" stroke="#0f172a" stroke-width="6"/>
  
  <!-- Whistle Lanyard & Whistle -->
  <path d="M 90 128 L 98 140 L 100 145 L 102 140 L 110 128" fill="none" stroke="#f97316" stroke-width="2"/>
  <circle cx="100" cy="147" r="4" fill="#f97316"/>

  <!-- Head -->
  <circle cx="100" cy="105" r="18" fill="#fed7aa" stroke="#0f172a" stroke-width="3"/>
  <path d="M 82 100 C 84 88 92 86 100 86 C 108 86 116 88 118 100 Z" fill="#334155"/>

  <!-- Signal: Unsportsmanlike Foul (Grasp wrist above head) -->
  <!-- Left arm extending upwards -->
  <path d="M 65 145 Q 60 90 92 65" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <!-- Left hand fist held aloft -->
  <circle cx="94" cy="55" r="8" fill="#fed7aa" stroke="#0f172a" stroke-width="3"/>

  <!-- Right arm reaching across to grasp the left wrist -->
  <path d="M 135 145 Q 140 90 106 65" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <!-- Grasping hand wrapping around wrist -->
  <rect x="88" y="60" width="18" height="12" rx="5" fill="#fed7aa" stroke="#0f172a" stroke-width="3" transform="rotate(10 97 66)"/>

  <!-- Attention accents -->
  <path d="M 80 46 L 74 40" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
  <path d="M 100 42 L 100 35" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
  <path d="M 120 46 L 126 40" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>

  <!-- Label badge -->
  <rect x="22" y="15" width="156" height="26" rx="13" fill="#ea580c"/>
  <text x="100" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">FIBA Signal: Unsportliches Foul</text>
</svg>
